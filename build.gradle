plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'io.github.tomoarrow-inc'
version = findProperty('publishVersion') ?: '1.0.0-SNAPSHOT'

wrapper {
    gradleVersion = '8.14.3'
    distributionUrl = "https://services.gradle.org/distributions/gradle-$gradleVersion-all.zip"
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

javadoc {
    options.encoding = 'UTF-8'
}

ext {
    jackson_version = '2.21.1'
    jackson_annotations_version = '2.21'
    jakarta_annotation_version = '1.3.5'
    junit_version = '5.10.2'
    httpmime_version = '4.5.13'
}

dependencies {
    api "com.fasterxml.jackson.core:jackson-annotations:$jackson_annotations_version"
    api "com.fasterxml.jackson.core:jackson-core:$jackson_version"
    api "com.fasterxml.jackson.core:jackson-databind:$jackson_version"
    api "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:$jackson_version"
    api 'org.openapitools:jackson-databind-nullable:0.2.9'

    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation "jakarta.annotation:jakarta.annotation-api:$jakarta_annotation_version"
    implementation "org.apache.httpcomponents:httpmime:$httpmime_version"
    implementation 'org.apache.commons:commons-lang3:3.18.0'

    testImplementation "org.junit.jupiter:junit-jupiter-api:$junit_version"
    testImplementation "org.junit.jupiter:junit-jupiter-params:$junit_version"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junit_version"
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'io.github.tomoarrow-inc'
            artifactId = 'tomo-idv-client-java'
            version = project.version
            from components.java

            pom {
                name = 'Tomo IDV Client Java'
                description = 'Java client SDK for the Tomo Identity Verification API.'
                url = 'https://github.com/Tomoarrow-Inc/tomo-idv-client-java'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'tomoarrow'
                        name = 'Tomoarrow Inc'
                        email = 'dev@tomoarrow.com'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/Tomoarrow-Inc/tomo-idv-client-java.git'
                    developerConnection = 'scm:git:ssh://github.com/Tomoarrow-Inc/tomo-idv-client-java.git'
                    url = 'https://github.com/Tomoarrow-Inc/tomo-idv-client-java'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'central'
            url = 'https://central.sonatype.com/api/v1/publisher/deployments/download/'
            credentials {
                username = findProperty('centralUsername') ?: System.getenv('MAVEN_CENTRAL_USERNAME') ?: ''
                password = findProperty('centralPassword') ?: System.getenv('MAVEN_CENTRAL_PASSWORD') ?: ''
            }
        }
    }
}

signing {
    useGpgCmd()
    required {
        !version.toString().endsWith('SNAPSHOT')
            && gradle.taskGraph.hasTask(':publish')
            && !gradle.taskGraph.hasTask(':publishToMavenLocal')
    }
    sign publishing.publications.maven
}

tasks.withType(org.gradle.plugins.signing.Sign).configureEach {
    onlyIf {
        !project.version.toString().endsWith('SNAPSHOT')
            && gradle.taskGraph.hasTask(':publish')
            && !gradle.taskGraph.hasTask(':publishToMavenLocal')
    }
}
